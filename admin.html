<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration des commandes — TAW.co</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17251f;background:#f7f8f5}
*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:26px;margin:0 0 6px}.muted{color:#65746b;font-size:14px}
.panel{background:white;border:1px solid #e1e7df;border-radius:14px;padding:18px;margin:18px 0}
input,select,button{font:inherit;border:1px solid #d6ded5;border-radius:8px;padding:10px;background:white}
button{background:#176448;color:white;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.55;cursor:wait}
.login{display:flex;gap:10px;flex-wrap:wrap}.login input{flex:1;min-width:220px}
#message{margin-top:10px;color:#9a4d16}.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0eb;vertical-align:top;font-size:14px}
th{color:#65746b;font-weight:600}.items{max-width:240px}.actions{display:grid;gap:7px;min-width:190px}.actions input,.actions select{width:100%}
.price{white-space:nowrap;font-weight:700}.status{font-weight:600}.empty{padding:28px;text-align:center;color:#65746b}
@media(max-width:600px){body{padding:14px}h1{font-size:22px}.panel{padding:12px}}
</style>
</head>
<body><main class="wrap">
<header><div><h1>TAW.co — Commandes</h1><div class="muted">Espace privé de gestion des paiements, expéditions et suivis</div></div><button id="refresh">Actualiser</button></header>
<section class="panel">
<div class="login"><input id="token" type="password" autocomplete="current-password" placeholder="Jeton administrateur"><button id="connect">Accéder aux commandes</button></div>
<div id="message" role="status"></div>
</section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>Commande</th><th>Client</th><th>Articles</th><th>Montant</th><th>Livraison / suivi</th><th>Enregistrer</th></tr></thead><tbody id="orders"><tr><td colspan="6" class="empty">Connectez-vous pour afficher les commandes.</td></tr></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id), statuses=["à préparer","en préparation","expédiée","livrée","annulée","remboursée"];
let token=sessionStorage.getItem("tawco_admin_token")||"";
$("token").value=token;
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n}
function money(cents,currency){return (Number(cents||0)/100).toLocaleString("fr-FR",{style:"currency",currency:(currency||"eur").toUpperCase()})}
function auth(){return {Authorization:"Bearer "+token}}
function message(text){$("message").textContent=text||""}
async function load(){
 token=$("token").value.trim();if(!token){message("Saisissez le jeton administrateur.");return}
 $("connect").disabled=true;$("refresh").disabled=true;message("Chargement des commandes…");
 try{
  const response=await fetch("/api/admin-orders",{headers:auth(),cache:"no-store"}),data=await response.json();
  if(!response.ok)throw new Error(data.error||"Accès impossible.");
  sessionStorage.setItem("tawco_admin_token",token);render(data.orders||[]);message((data.orders||[]).length+" commande(s) chargée(s).");
 }catch(e){message(e.message);$("orders").replaceChildren(node("tr",undefined));}
 finally{$("connect").disabled=false;$("refresh").disabled=false}
}
function render(orders){
 const body=$("orders");body.replaceChildren();
 if(!orders.length){const tr=node("tr");const td=node("td","Aucune commande enregistrée.","empty");td.colSpan=6;tr.append(td);body.append(tr);return}
 for(const order of orders){
  const tr=node("tr"),date=new Date(order.created_at).toLocaleString("fr-FR");
  const first=node("td");first.append(node("strong",order.id.slice(0,8).toUpperCase()),node("div",date,"muted"),node("div","Paiement : "+(order.payment_status||"—"),"muted"));tr.append(first);
  const customer=node("td");customer.append(node("strong",order.customer_name||"Client"),node("div",order.customer_email||""),node("div",[order.shipping_address?.line1,order.shipping_address?.postal_code,order.shipping_address?.city].filter(Boolean).join(", "),"muted"));tr.append(customer);
  const items=node("td",undefined,"items");for(const item of (order.items||[]))items.append(node("div",(item.quantity||1)+" × "+(item.name||"Article")));tr.append(items);
  tr.append(node("td",money(order.amount_total,order.currency),"price"));
  const actions=node("td",undefined,"actions");
  const status=document.createElement("select");for(const s of statuses){const opt=node("option",s);opt.value=s;if(s===order.fulfillment_status)opt.selected=true;status.append(opt)}
  const carrier=node("input");carrier.placeholder="Transporteur";carrier.value=order.carrier||"";
  const tracking=node("input");tracking.placeholder="Numéro de suivi";tracking.value=order.tracking_number||"";
  const url=node("input");url.placeholder="Lien de suivi https://…";url.value=order.tracking_url||"";
  actions.append(status,carrier,tracking,url);tr.append(actions);
  const saveCell=node("td"),save=node("button","Enregistrer");save.addEventListener("click",async()=>{
   save.disabled=true;message("Mise à jour de la commande "+order.id.slice(0,8)+"…");
   try{const response=await fetch("/api/admin-orders",{method:"PATCH",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({id:order.id,fulfillment_status:status.value,carrier:carrier.value,tracking_number:tracking.value,tracking_url:url.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Mise à jour impossible.");message("Commande mise à jour. E-mail envoyé si le service d’e-mail est configuré.");}
   catch(e){message(e.message)}finally{save.disabled=false}
  });saveCell.append(save);tr.append(saveCell);body.append(tr);
 }
}
$("connect").addEventListener("click",load);$("refresh").addEventListener("click",load);
$("token").addEventListener("keydown",e=>{if(e.key==="Enter")load()});
if(token)load();
</script></body></html>
